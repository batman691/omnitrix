name: CI/CD FastAPI (Test + Deploy)

on:
push:
branches: [ "main" ]
workflow_dispatch:

jobs:

test:
runs-on: ubuntu-latest

```
steps:
- name: Checkout code
  uses: actions/checkout@v4

- name: Set up Docker Buildx
  uses: docker/setup-buildx-action@v3

# 🧪 Build image locally (no push)
- name: Build image
  uses: docker/build-push-action@v5
  with:
    context: .
    push: false
    load: true
    tags: fastapi-test:latest
    platforms: linux/amd64

# 🚀 Run container
- name: Run container
  run: |
    docker run -d -p 8000:8000 --name test-app fastapi-test:latest
    sleep 5

# 🧪 Test endpoint
- name: Test API
  run: |
    curl -f http://localhost:8000/docs || exit 1

- name: Stop container
  run: |
    docker stop test-app
    docker rm test-app
```

deploy:
needs: test
runs-on: ubuntu-latest

```
steps:
- name: Checkout code
  uses: actions/checkout@v4

- name: Set up Docker Buildx
  uses: docker/setup-buildx-action@v3

- name: Login to Docker Hub
  uses: docker/login-action@v3
  with:
    username: ${{ secrets.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}

- name: Build and push image
  uses: docker/build-push-action@v5
  with:
    context: .
    push: true
    tags: achin43/rep:latest
    platforms: linux/amd64

- name: Deploy to VM
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.VM_HOST }}
    username: ${{ secrets.VM_USER }}
    key: ${{ secrets.VM_SSH_KEY }}
    script: |
      docker pull achin43/rep:latest
      docker stop my-app || true
      docker rm my-app || true
      docker run -d -p 8000:8000 --restart always --name my-app achin43/rep:latest
```

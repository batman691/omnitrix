name: CI/CD FastAPI App
on:
push:
branches: [ "main" ]
jobs:
build-and-deploy:
runs-on: ubuntu-latest
steps:
# 📥 Checkout code
- name: Checkout repository
  uses: actions/checkout@v4

# 🔧 Set up Docker Buildx (for multi-arch builds)
- name: Set up Docker Buildx
  uses: docker/setup-buildx-action@v3

# 🔐 Login to Docker Hub
- name: Login to Docker Hub
  uses: docker/login-action@v3
  with:
    username: ${{ secrets.DOCKER_USERNAME }}
    password: ${{ secrets.DOCKER_PASSWORD }}

# 🏗️ Build and push image (AMD64 IMPORTANT)
- name: Build and push Docker image
  uses: docker/build-push-action@v5
  with:
    context: .
    push: true
    tags: achin43/rep:latest
    platforms: linux/amd64

# 🚀 Deploy to Oracle VM
- name: Deploy to VM via SSH
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.VM_HOST }}
    username: ${{ secrets.VM_USER }}
    key: ${{ secrets.VM_SSH_KEY }}
    script: |
      docker pull achin43/rep:latest
      docker stop my-app || true
      docker rm my-app || true
      docker run -d -p 8000:8000 --restart always --name my-app achin43/rep:latest
